function strike(){if(!running)return;let now=performance.now();if(now<attackTime){toast('🔥 灵息弹冷却中 '+((attackTime-now)/1000).toFixed(1)+'秒');return}attackTime=now+850;let target=null,best=440;for(let e of enemies){let d=dist(e,player);if(d<best){best=d;target=e}}let a=target?Math.atan2(target.y-player.y,target.x-player.x):player.angle;projectiles.push({x:player.x,y:player.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,life:1,damage:18+level*9+evoStage*8});flash('🔥 灵息弹');toast(target?'🔥 自动锁定妖兽，灵息弹发射！':'🔥 灵息弹发射！附近没有妖兽')}
