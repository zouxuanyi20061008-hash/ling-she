function drawRock(x,y,r){ctx.fillStyle='#172d2c66';ctx.beginPath();ctx.ellipse(x+4,y+5,r*1.1,r*.45,0,0,7);ctx.fill();ctx.fillStyle='#687f77';ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x-r*.62,y-r*.8);ctx.lineTo(x+r*.2,y-r);ctx.lineTo(x+r,y-r*.25);ctx.lineTo(x+r*.7,y+r*.35);ctx.closePath();ctx.fill();ctx.fillStyle='#b5c2aa';ctx.beginPath();ctx.moveTo(x-r*.62,y-r*.8);ctx.lineTo(x+r*.2,y-r);ctx.lineTo(x+r*.25,y-r*.3);ctx.lineTo(x-r*.15,y-r*.42);ctx.closePath();ctx.fill();ctx.strokeStyle='#334f4b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+r*.2,y-r);ctx.lineTo(x+r*.25,y-r*.3);ctx.lineTo(x+r*.7,y+r*.35);ctx.stroke()}
function drawMeadow(x,y){let b=biome(x,y);if(b!==0)return;let seed=terrainHash(Math.floor(x/100),Math.floor(y/100));ctx.strokeStyle=seed>.5?'#a2b967':'#315c39';ctx.lineWidth=1.5;for(let k=0;k<5;k++){let xx=x+(terrainHash(x,k,1)-.5)*65,yy=y+(terrainHash(y,k,2)-.5)*60;ctx.beginPath();ctx.moveTo(xx,yy+5);ctx.lineTo(xx-3,yy-4);ctx.moveTo(xx,yy+5);ctx.lineTo(xx+3,yy-6);ctx.stroke();if(k===2||k===4)drawFlower(xx,yy-3,k===2?'#f6d1dc':'#e9e2a6')}}

// V5 playable vertical slice: world-space terrain rules, bridge, collision and layered light.
function streamCenter(y){return 1060+Math.sin(y*.0035)*175+Math.sin(y*.009)*58}
function isBridge(x,y){return y>1740&&y<1860&&Math.abs(x-streamCenter(y))<86}
function isWater(x,y){let pool=(x-1480)*(x-1480)/(64*64)+(y-1551)*(y-1551)/(28*28)<1;return pool||(y>=1200&&y<=3500&&Math.abs(x-streamCenter(y))<30&&!isBridge(x,y))}
function isCliff(x,y){return x>1370&&x<1660&&y>1230&&y<1610&&Math.sin((x-1370)*.018)*32+y<1560}
function terrainBlocked(x,y){return isWater(x,y)||isCliff(x,y)||isLandmarkBlocked(x,y)}
function drawBridge(){let y=1800,x=streamCenter(y);ctx.save();ctx.translate(x,y);ctx.fillStyle='#261e1b88';ctx.fillRect(-60,-57,120,114);ctx.fillStyle='#745039';ctx.fillRect(-56,-55,112,110);for(let k=-5;k<=5;k++){ctx.fillStyle=k%2?'#aa8052':'#94683f';ctx.fillRect(-54,k*10-5,108,9);ctx.strokeStyle='#563d2a';ctx.lineWidth=1;ctx.strokeRect(-54,k*10-5,108,9)}ctx.fillStyle='#d5b47b';ctx.fillRect(-63,-57,8,114);ctx.fillRect(55,-57,8,114);for(let k=-1;k<=1;k++){ctx.fillStyle='#59432c';ctx.fillRect(-66,k*48-3,13,9);ctx.fillRect(54,k*48-3,13,9)}ctx.restore()}
function drawCliff(){ctx.save();ctx.fillStyle='#34483b';ctx.beginPath();ctx.moveTo(1360,1230);ctx.lineTo(1660,1230);ctx.lineTo(1660,1570);ctx.lineTo(1540,1540);ctx.lineTo(1450,1610);ctx.lineTo(1360,1570);ctx.closePath();ctx.fill();ctx.fillStyle='#77826c';ctx.beginPath();ctx.moveTo(1360,1210);ctx.lineTo(1660,1210);ctx.lineTo(1660,1500);ctx.lineTo(1550,1480);ctx.lineTo(1450,1550);ctx.lineTo(1360,1500);ctx.closePath();ctx.fill();ctx.strokeStyle='#d0c69a';ctx.lineWidth=5;ctx.stroke();ctx.restore()}
function drawAtmosphere(now){ctx.save();ctx.globalCompositeOperation='screen';let g=ctx.createRadialGradient(player.x-220,player.y-270,20,player.x-220,player.y-270,520);g.addColorStop(0,'#fff1a52c');g.addColorStop(1,'#fff1a500');ctx.fillStyle=g;ctx.fillRect(camX,camY,W,H);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.11;ctx.fillStyle='#d7f5d9';for(let i=0;i<9;i++){let x=camX+((i*179+now*.009)%(W+280))-140,y=camY+((i*83)%Math.max(H,1));ctx.beginPath();ctx.ellipse(x,y,120,18,-.3,0,7);ctx.fill()}ctx.restore()}

// V5.2 art pipeline: cached pixel-texture atlas, generated once rather than redrawn as primitives every frame.
// Small fixed palette and clustered details keep a consistent pixel scale on mobile.
const terrainAtlas=[];
function buildTerrainAtlas(){
const palettes=[
 ['#507c49','#628f53','#79a363','#3f7042','#a4b86c'],
 ['#a7c2c1','#d6e5df','#eef3eb','#8ea9b2','#f8ffff'],
 ['#a77f52','#cfa76b','#e2be80','#926f4d','#efd29a'],
 ['#51465e','#75647f','#917b9b','#40384c','#b09aa8']
];
for(let b=0;b<4;b++){terrainAtlas[b]=[];for(let variant=0;variant<5;variant++){
let c=document.createElement('canvas');c.width=c.height=128;let g=c.getContext('2d');let p=palettes[b];g.fillStyle=p[(variant%2)?0:1];g.fillRect(0,0,128,128);
for(let i=0;i<290;i++){let n=terrainHash(i,variant,b),m=terrainHash(variant,i,b+9);let x=Math.floor(n*64)*2,y=Math.floor(m*64)*2;let k=terrainHash(i,b,variant+13);g.fillStyle=p[k>.91?4:k>.7?2:k>.32?0:3];g.globalAlpha=.14+k*.32;g.fillRect(x,y,k>.72?6:2,k>.83?4:2)}
g.globalAlpha=1;
for(let j=0;j<18;j++){let x=Math.floor(terrainHash(j,variant,b+19)*60)*2,y=Math.floor(terrainHash(j,b,variant+23)*60)*2;
if(b===0){g.fillStyle=j%3?'#244f34':'#c0c67e';g.fillRect(x,y,2,8);g.fillRect(x-2,y+2,2,4);g.fillRect(x+2,y,2,4);if(j%6===0){g.fillStyle='#f4d6db';g.fillRect(x,y-3,4,4);g.fillStyle='#f6e9a7';g.fillRect(x+1,y-2,2,2)}}
else if(b===1){g.fillStyle='#f8ffffaa';g.fillRect(x,y,6,2)}
else if(b===2){g.fillStyle='#94734c';g.fillRect(x,y,6,2);g.fillRect(x+2,y+2,4,2)}
else{g.fillStyle='#ac91c3';g.fillRect(x,y,4,2)}
}
terrainAtlas[b][variant]=c;
}}}
buildTerrainAtlas();

// V5.2: reusable hand-pixelled foliage sprite atlas, with independent canopy and ground-shadow passes.
const foliageAtlas=[];
function makeFoliageAtlas(){for(let biomeId=0;biomeId<4;biomeId++){let c=document.createElement('canvas');c.width=128;c.height=144;let g=c.getContext('2d');g.imageSmoothingEnabled=false;let colors=biomeId===1?['#607e7e','#8eacaa','#d8ece2','#f4fcf5']:biomeId===2?['#655944','#92815a','#c2a66c','#e8c98c']:biomeId===3?['#352e4c','#574465','#84658d','#c59ec7']:['#163d36','#245b43','#3c8052','#83ae69'];
g.fillStyle='#493c2e';g.fillRect(60,64,10,62);g.fillStyle='#8b7650';g.fillRect(62,66,3,53);g.fillStyle='#302f26';g.fillRect(53,95,7,6);g.fillRect(70,88,7,5);
for(let layer=0;layer<3;layer++){let yy=67-layer*18,rad=38-layer*6;for(let i=0;i<45;i++){let angle=terrainHash(i,layer,biomeId)*6.283,r=Math.sqrt(terrainHash(layer,i,biomeId+8))*rad;let xx=64+Math.cos(angle)*r,py=yy+Math.sin(angle)*r*.53;let n=terrainHash(i,biomeId,layer+11);g.fillStyle=colors[n>.91?3:n>.55?2:n>.2?1:0];let w=n>.7?10:7;g.fillRect(Math.floor(xx/3)*3,Math.floor(py/3)*3,w,7)}}
g.fillStyle=colors[3];for(let i=0;i<11;i++){let xx=32+terrainHash(i,biomeId,23)*66,yy=23+terrainHash(i,biomeId,27)*38;g.globalAlpha=.5;g.fillRect(xx,yy,5,3)}g.globalAlpha=1;foliageAtlas.push(c)}}
makeFoliageAtlas();
function drawFoliageSprite(o){let b=biome(o.x,o.y),sz=72+o.size*2.2;ctx.fillStyle='#12271d55';ctx.beginPath();ctx.ellipse(o.x+9,o.y+3,sz*.42,sz*.15,-.2,0,Math.PI*2);ctx.fill();ctx.drawImage(foliageAtlas[b],o.x-sz*.5,o.y-sz*1.04,sz,sz*1.13)}
function inView(x,y,m=64){return x>=camX-m&&x<=camX+W+m&&y>=camY-m&&y<=camY+H+m}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.imageSmoothingEnabled=false;ctx.translate(-camX,-camY);let tile=100,startX=Math.max(0,Math.floor(camX/tile)-1),endX=Math.min(36,Math.ceil((camX+W)/tile)+1),startY=Math.max(0,Math.floor(camY/tile)-1),endY=Math.min(36,Math.ceil((camY+H)/tile)+1);for(let x=startX;x<endX;x++)for(let y=startY;y<endY;y++){let b=biome(x*tile+50,y*tile+50);let variant=Math.floor(terrainHash(x,y,4)*5);ctx.drawImage(terrainAtlas[b][variant],x*tile,y*tile,tile+1,tile+1)}
// HD-2D terrain pass: stable pixel-scale microtextures and soft environmental accents.
ctx.save();for(let tx=startX;tx<endX;tx++)for(let ty=startY;ty<endY;ty++){let bx=tx*tile,by=ty*tile,b=biome(bx+50,by+50);for(let k=0;k<10;k++){let seed=Math.sin((tx*197+ty*71+k*43)*12.9898)*43758.5453;let u=seed-Math.floor(seed);seed=Math.sin((tx*29+ty*193+k*67)*78.233)*18374.239;let v=seed-Math.floor(seed);let px=bx+u*tile,py=by+v*tile;ctx.globalAlpha=.18+(k%3)*.06;ctx.fillStyle=b===1?'#ffffff':b===2?'#fff0ad':b===3?'#bca1db':'#b9eaa0';ctx.fillRect(Math.round(px),Math.round(py),2+(k%4)*2,2+(k%2)*3)}}ctx.restore();
paintStoneRoad();
// River and its collision-safe crossing.
ctx.save();ctx.lineCap='round';ctx.lineJoin='round';const riverPath=()=>{ctx.beginPath();for(let yy=1200;yy<=3500;yy+=36){let xx=1060+Math.sin(yy*.0035)*175+Math.sin(yy*.009)*58;if(yy===1200)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}};ctx.strokeStyle='#385b46';ctx.lineWidth=92;riverPath();ctx.stroke();ctx.strokeStyle='#7d9f80';ctx.lineWidth=75;riverPath();ctx.stroke();ctx.strokeStyle='#366e83';ctx.lineWidth=58;riverPath();ctx.stroke();ctx.strokeStyle='#5ba5a5';ctx.lineWidth=40;riverPath();ctx.stroke();ctx.globalAlpha=.32;ctx.strokeStyle='#c5eee1';ctx.lineWidth=2;for(let j=0;j<48;j++){let yy=1230+j*47,xx=1060+Math.sin(yy*.0035)*175+Math.sin(yy*.009)*58;ctx.beginPath();ctx.moveTo(xx-9,yy);ctx.lineTo(xx+7,yy-3);ctx.stroke()}ctx.restore();paintStreamBanks();if(inView(streamCenter(1800),1800,145)&&!paintBridge(streamCenter(1800),1800))drawBridge();if(camX<1700&&camX+W>1310&&camY<1600&&camY+H>1180&&!paintCliffScene())drawCliff();paintCloudfall(performance.now());
// Detailed HD-2D foreground textures; deterministic placement avoids visual flicker.
ctx.save();for(let tx=startX;tx<endX;tx++)for(let ty=startY;ty<endY;ty++){let x=tx*tile+50,y=ty*tile+50;if(biome(x,y)!==0)continue;if(onQinglanRoad(x,y)||landmarkClearing(x,y,40))continue;drawMeadow(x,y);let n=terrainHash(tx,ty,7);if(n>.78){if(!paintBambooStand(x-23,y+24,.65+n*.45))drawBamboo(x-23,y+24,.65+n*.45);if(!paintBambooStand(x+8,y+13,.55+n*.3))drawBamboo(x+8,y+13,.55+n*.3)}else if(n<.13){drawPine(x+18,y+25,16+n*35)}else if(n>.45&&n<.53){drawRock(x+18,y+24,10+n*8)}}ctx.restore();
for(let o of decor){if(!inView(o.x,o.y,180))continue;let b=biome(o.x,o.y);if(o.type<.29){if(b!==0||!paintTreeScene(o,72+o.size*2.2))drawFoliageSprite(o)}else if(o.type<.65){drawFlower(o.x,o.y,b===1?'#f4ffff':b===2?'#f5db9a':'#eac8d9')}else if(o.type<.79){if(!paintBambooStand(o.x,o.y,.6+o.size/40))drawBamboo(o.x,o.y,.6+o.size/40)}else{drawRock(o.x,o.y,Math.max(5,o.size*.6))}}for(let o of obstacles){if(!inView(o.x,o.y,o.r+12))continue;circle(o.x+3,o.y+5,o.r,'#273d35a0');drawRock(o.x,o.y,o.r)}paintLandmarks();paintShrineLanterns(performance.now());paintLandmarkTitles();for(let f of fruits){if(!inView(f.x,f.y,20))continue;circle(f.x,f.y,11,f.kind?'#ffd26344':'#74ffc344');circle(f.x,f.y,f.kind?7:5,f.kind?'#ffe47d':'#8cf6b0')}if(boss&&!boss.defeated&&inView(boss.x,boss.y,140)){circle(boss.x+5,boss.y+8,boss.r+8,'#20172c');circle(boss.x,boss.y,boss.r,'#7f426f');circle(boss.x-14,boss.y-8,7,'#ffd678');circle(boss.x+14,boss.y-8,7,'#ffd678');ctx.fillStyle='#250d27';ctx.fillRect(boss.x-56,boss.y-65,112,9);ctx.fillStyle='#fa778f';ctx.fillRect(boss.x-56,boss.y-65,112*Math.max(0,boss.hp/boss.max),9);ctx.fillStyle='#fff2bd';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('幽冥妖王 · BOSS',boss.x,boss.y-72)}for(let e of enemies){if(!inView(e.x,e.y,e.r+20))continue;circle(e.x,e.y,e.r+3,'#1b2837');if(!paintCreature(e)){circle(e.x,e.y,e.r,performance.now()<e.hitFlash?'#ffffff':e.elite?'#e1a34e':biome(e.x,e.y)===3?'#bc70d5':'#bf645b');circle(e.x-5,e.y-3,3,'#fff3cc');circle(e.x+5,e.y-3,3,'#fff3cc')}if(e.elite){ctx.strokeStyle='#f9da83';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#341f25';ctx.fillRect(e.x-17,e.y-e.r-11,34,4);ctx.fillStyle='#e6b07c';ctx.fillRect(e.x-17,e.y-e.r-11,34*e.hp/e.max,4)}for(let p of projectiles){if(!inView(p.x,p.y,20))continue;circle(p.x,p.y,12,p.hostile?'#bd6dff88':'#ff9b3988');circle(p.x,p.y,6,p.hostile?'#e6baff':'#ffe3a0')}for(let i=trail.length-1;i>=1;i--){let t=trail[i];if(!paintBody(t,i))circle(t.x,t.y,Math.max(5,10-i*.07),i%2?'#67bb77':'#87d48a')}if(!paintHead(player,player.angle,evoStage)){circle(player.x,player.y,13+evoStage*2,performance.now()<invuln?'#e9d9aa':['#a3f3a2','#82e8c0','#75d6db','#84b8ff','#e8d08d'][evoStage]);let ax=Math.cos(player.angle),ay=Math.sin(player.angle);circle(player.x+ax*8-ay*5,player.y+ay*8+ax*5,2.3,'#163d27');circle(player.x+ax*8+ay*5,player.y+ay*8-ax*5,2.3,'#163d27')}for(let p of particles)circle(p.x,p.y,Math.max(1,p.life*5),p.color);ctx.font='bold 16px system-ui';ctx.textAlign='center';for(let t of damageTexts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y)}ctx.globalAlpha=1;paintLandmarkFront(player);paintForegroundCanopies(player,decor,camX,camY,W,H);drawAtmosphere(performance.now());ctx.restore();mc.clearRect(0,0,112,112);for(let y=0;y<36;y+=2)for(let x=0;x<36;x+=2){mc.fillStyle=biomes[biome(x*100,y*100)].color;mc.fillRect(x*112/36,y*112/36,112/18+1,112/18+1)}mc.fillStyle='#b3e1db';mc.fillRect(QINGLAN_GATE.x/SIZE*112-2,QINGLAN_GATE.y/SIZE*112-2,4,4);mc.fillStyle='#e5bc87';mc.fillRect(QINGLAN_SHRINE.x/SIZE*112-2,QINGLAN_SHRINE.y/SIZE*112-2,4,4);mc.fillStyle='#ffe99a';mc.beginPath();mc.arc(player.x/SIZE*112,player.y/SIZE*112,3.5,0,7);mc.fill()}
function buttonFeedback(now){const items=[['dash',dashReady,'⚡ 灵蛇遁'],['heal',healReady,'🌿 回春术'],['strike',attackTime,'🔥 灵息弹']];for(const [id,ready,label] of items){const b=document.getElementById(id),remaining=Math.max(0,(ready-now)/1000);b.classList.toggle('cooling',remaining>0);b.innerHTML=label+'<small>'+(remaining>0?'冷却 '+remaining.toFixed(1)+'s':'可使用')+'</small>'}const b=document.getElementById('breakthrough');b.classList.toggle('ready',exp>=need);b.innerHTML='🌀 突破<small>'+(exp>=need?'✨ 可以突破':'差 '+Math.max(0,Math.ceil(need-exp))+' 修为')+'</small>'}let lastButtons=0;function loop(now){if(now-lastButtons>100){buttonFeedback(now);lastButtons=now;}let dt=Math.min((now-last)/1000||0,.04);last=now;if(running)update(dt,now);draw();requestAnimationFrame(loop)}function startGame(resume=true){reset();const restored=resume&&loadGame();running=true;document.querySelector('#panel').style.display='none';toast(restored?'📜 已恢复上次修炼进度':'🌱 欢迎来到青岚平原')}document.querySelector('#start').onclick=()=>startGame(true);document.querySelector('#saveBtn').addEventListener('pointerdown',e=>{e.preventDefault();saveGame()});reset();if(offlineStore.getItem(SAVE_KEY))document.querySelector("#start").textContent="继续修仙（读取存档）";requestAnimationFrame(loop);
</script></body></html>
