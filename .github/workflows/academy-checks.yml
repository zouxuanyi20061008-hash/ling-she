name: Academy checks
on:
  push:
    branches:
      - meihua-web-deploy
  pull_request:
    branches:
      - meihua-web-deploy
  workflow_dispatch:
jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Run frontend regression tests
        working-directory: frontend
        run: npm run test:ui
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  backend:
    name: Backend deterministic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Download public stroke/IDS reference data
        run: python backend/scripts/download_data.py
      - name: Run backend regression tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
  deploy_after_checks:
    name: Deploy tested academy to Render
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy with Render secret hook when configured
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "Render deploy hook secret has not been configured. Tests passed, but no deploy was started." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 25 --request POST "$RENDER_DEPLOY_HOOK" >/dev/null
          echo "Render accepted the deployment request after both CI jobs passed." >> "$GITHUB_STEP_SUMMARY"
