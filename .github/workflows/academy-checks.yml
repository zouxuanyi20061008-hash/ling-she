name: Academy checks
on:
  push:
    branches:
      - meihua-web-deploy
  workflow_dispatch:
jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Run frontend regression tests
        working-directory: frontend
        run: npm run test:ui
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  backend:
    name: Backend deterministic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Download public stroke/IDS reference data
        run: python backend/scripts/download_data.py
      - name: Run backend regression tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
      - name: Run V48 six-yao end-to-end acceptance
        env:
          PYTHONPATH: backend
        run: |
          mkdir -p backend/acceptance-output
          python backend/scripts/liuyao_v48_acceptance.py --output backend/acceptance-output/liuyao-v48.json
      - name: Upload V48 acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: liuyao-v48-acceptance
          path: backend/acceptance-output/liuyao-v48.json
          if-no-files-found: error
      - name: Run V49 independent classical examples
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/liuyao_v49_classic_cases.py --output backend/acceptance-output/liuyao-v49.json
      - name: Upload V49 independent classical evidence
        uses: actions/upload-artifact@v4
        with:
          name: liuyao-v49-classic-cases
          path: backend/acceptance-output/liuyao-v49.json
          if-no-files-found: error
      - name: Run V50 Qimen classical earth plate acceptance
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/qimen_v50_acceptance.py --output backend/acceptance-output/qimen-v50.json
      - name: Upload V50 Qimen earth-plate acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: qimen-v50-earthplate-acceptance
          path: backend/acceptance-output/qimen-v50.json
          if-no-files-found: error
      - name: Run V51 Qimen rotated stars and gates acceptance
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/qimen_v51_acceptance.py --output backend/acceptance-output/qimen-v51.json
      - name: Upload V51 Qimen full ring acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: qimen-v51-star-gate-acceptance
          path: backend/acceptance-output/qimen-v51.json
          if-no-files-found: error
      - name: Run V52 Qimen spirit and hour marker acceptance
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/qimen_v52_acceptance.py --output backend/acceptance-output/qimen-v52.json
      - name: Upload V52 Qimen independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: qimen-v52-spirit-markers
          path: backend/acceptance-output/qimen-v52.json
          if-no-files-found: error
      - name: Run V53 Qimen classical ten-stem and three-escape acceptance
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/qimen_v53_acceptance.py --output backend/acceptance-output/qimen-v53.json
      - name: Upload V53 classical pattern evidence
        uses: actions/upload-artifact@v4
        with:
          name: qimen-v53-classical-patterns
          path: backend/acceptance-output/qimen-v53.json
          if-no-files-found: error
      - name: Run V54 Qimen independent classical three-wonders acceptance
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/qimen_v54_acceptance.py --output backend/acceptance-output/qimen-v54.json
      - name: Upload V54 independent primary-text truth set
        uses: actions/upload-artifact@v4
        with:
          name: qimen-v54-wonders-classical-anchors
          path: backend/acceptance-output/qimen-v54.json
          if-no-files-found: error
      - name: Run V55 real four-pillars independent date fixtures
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/bazi_v55_acceptance.py --output backend/acceptance-output/bazi-v55.json
      - name: Upload V55 real four-pillars acceptance
        uses: actions/upload-artifact@v4
        with:
          name: bazi-v55-four-pillars-fixtures
          path: backend/acceptance-output/bazi-v55.json
          if-no-files-found: error
      - name: Run V56 Bazi luck-decades canonical crosschecks
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/bazi_v56_acceptance.py --output backend/acceptance-output/bazi-v56.json
      - name: Upload V56 Bazi ten-year luck canonical evidence
        uses: actions/upload-artifact@v4
        with:
          name: bazi-v56-luck-start-cases
          path: backend/acceptance-output/bazi-v56.json
          if-no-files-found: error
      - name: Run V57 Bazi Jie-year, 12-month and DaYun boundary acceptance
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/bazi_v57_acceptance.py --output backend/acceptance-output/bazi-v57.json
      - name: Upload V57 Bazi flow year month and time-match evidence
        uses: actions/upload-artifact@v4
        with:
          name: bazi-v57-flow-year-month
          path: backend/acceptance-output/bazi-v57.json
          if-no-files-found: error
      - name: Run V58 Liuren ancient lesson and transmission acceptance
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/liuren_v58_acceptance.py --output backend/acceptance-output/liuren-v58.json
      - name: Upload V58 Liuren verified historical examples
        uses: actions/upload-artifact@v4
        with:
          name: liuren-v58-classic-lessons
          path: backend/acceptance-output/liuren-v58.json
          if-no-files-found: error
      - name: Run V59 Liuren remote fuyin fanyin golden case acceptance
        env:
          PYTHONPATH: backend
        run: |
          python backend/scripts/liuren_v59_acceptance.py --output backend/acceptance-output/liuren-v59.json
      - name: Upload V59 historic three-transmission verification
        uses: actions/upload-artifact@v4
        with:
          name: liuren-v59-three-transmissions
          path: backend/acceptance-output/liuren-v59.json
          if-no-files-found: error
  deploy_after_checks:
    name: Deploy tested academy to Render
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy with Render secret hook when configured
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "Render deploy hook secret has not been configured. Tests passed, but no deploy was started." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 25 --request POST "$RENDER_DEPLOY_HOOK" >/dev/null
          echo "Render accepted the deployment request after both CI jobs passed." >> "$GITHUB_STEP_SUMMARY"
